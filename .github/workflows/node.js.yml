# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    env:
      PUBLIC_COMBAT_ENGINE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm check:memory-bank
      - run: pnpm install
      - run: pnpm check
      - run: pnpm build:all
      - run: pnpm lint:all
      - run: pnpm test:all
      - run: pnpm test:e2e:engine

  gasha-e2e:
    runs-on: ubuntu-latest

    # PUBLIC_COMBAT_ENGINE_URL: playwright.config.ts gives the dev server its default

    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: 'pnpm'
      - run: pnpm install
      - name: Install Chromium for Playwright
        run: pnpm --filter gasha exec playwright install --with-deps chromium
      - run: pnpm test:e2e:gasha
      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gasha-playwright-results
          path: clients/gasha/test-results
          retention-days: 7
